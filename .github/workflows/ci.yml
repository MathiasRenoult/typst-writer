name: Intégration continue

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Rien à installer : le binaire ne réclame que la libc, les bibliothèques
      # graphiques (Wayland, X11, Vulkan) étant chargées **à l'exécution**. Il
      # n'y a donc pas d'en-tête dont la compilation dépende — c'est vérifié par
      # `ldd` sur le binaire de publication.
      - uses: Swatinem/rust-cache@v2

      - name: Outil de lecture du PDF pour les tests de rendu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Tests
        run: cargo test --release

      # Les épreuves qui parlent au vrai serveur de langage ne tournent pas ici :
      # elles demandent tinymist, qu'une machine de CI n'a pas. À lancer à la
      # main :
      #     cargo test --release -- --ignored

      # Le crate vendoré mesure la largeur réelle des glyphes, et en déduit
      # qu'un caractère chinois est plus large qu'un « a » — ce qui suppose une
      # police couvrant les idéogrammes. L'ubuntu de la CI n'en a aucune : le
      # glyphe de remplacement y fait la largeur d'un « a », et l'assertion
      # tombe sur un défaut de la machine, pas du code. On lui donne donc la
      # police que le test suppose.
      - name: Polices pour les tests de métriques
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Tests du crate vendoré
        run: cargo test --manifest-path vendor/iced-code-editor/Cargo.toml --lib --features two-face

  # La vérification régulière des cibles (feuille de route, phase 5, point
  # 5.3) : Windows et macOS sont construits et éprouvés à chaque poussée. Il
  # n'est pas exigé d'un support complet — mais aucun choix architectural ne
  # doit empêcher la prise en charge, et la compilation le dirait tout de
  # suite. Les épreuves qui parlent à un outil externe (pdftotext) sautent
  # d'elles-mêmes là où il manque.
  portabilite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Construction
        run: cargo build --release

      - name: Tests
        run: cargo test --release
