# Configuration cargo-deny pour typst-writer.
#
# La règle : chaque exception porte sa raison. Un « ignore » sans explication
# est un oubli futur. Ce fichier se relit et se comprend sans sortir de lui.
#
# Vérification complète :
#   cargo deny check
# Par section :
#   cargo deny check licenses advisories bans sources

[graph]
# On cible Linux (le développement se fait sur cette plateforme). Les
# dépendances exclusivement Windows/macOS ne sont pas vérifiées ici.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ── Advisories ──────────────────────────────────────────────────────────
# Les vulnérabilités connues et les crates non maintenus.
[advisories]
ignore = [
    # ── quick-xml : deux vulnérabilités XML (ReDoS + mémoire) ──
    # quick-xml 0.38.4 est tiré par citationberg → hayagriva → typst-library.
    # C'est une dépendance transitive profonde de Typst, impossible à mettre
    # à jour depuis ce dépôt : il faudrait que citationberg passe à quick-xml
    # 0.41+. L'impact sur typst-writer est limité au parsing CSL-XML des
    # bibliographies — les données sont locales et de confiance. À surveiller
    # quand Typst publiera une version avec citationberg corrigé.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 via citationberg/hayagriva/typst — pas de correctif semver, données bibliographiques locales" },
    { id = "RUSTSEC-2026-0195", reason = "même chaîne que RUSTSEC-2026-0194 — quick-xml 0.38 via Typst" },

    # ── Crates non maintenus ──
    # Tous sont des dépendances transitives que nous ne contrôlons pas
    # directement. Ils restent fonctionnels et largement utilisés dans
    # l'écosystème. À re-vérifier quand les crates amont migreront.

    { id = "RUSTSEC-2025-0141", reason = "bincode non maintenu — utilisé par typst-assets pour la sérialisation interne" },
    { id = "RUSTSEC-2024-0436", reason = "paste non maintenu — macro proc, remplacé dans les futures versions de ses dépendants" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml non maintenu — dépôt archivé, transitive via serde_yaml (typst)" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust non maintenu — mainteneur injoignable, transitive via typst (serde_yaml)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz non maintenu — shaping de texte, remplacé par cosmic-text à terme" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser non maintenu — parsing de polices, transitive via rustybuzz/typst" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant non maintenu — D-Bus, transitive via iced/winit" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names non maintenu — D-Bus, transitive via iced/winit" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive non maintenu — D-Bus, transitive via iced/winit" },
]

# ── Licences ────────────────────────────────────────────────────────────
# Le projet est sous MIT. Toutes les licences listées ici sont permissives
# et compatibles avec la distribution sous MIT.
#
# Les expressions SPDX des dépendances utilisent des « OR » (choix libre) et
# des « AND » (cumul obligatoire). On autorise chaque identifiant qui peut
# être choisi ou exigé. Les licences copyleft fortes (GPL, AGPL) ne figurent
# que comme alternatives dans des « OR » — l'alternative permissive suffit.
[licenses]
allow = [
    # Permissives classiques
    "MIT",                          # La plus courante : 283+ crates
    "Apache-2.0",                   # La seconde : 34+ crates
    "Apache-2.0 WITH LLVM-exception", # LLVM/rustc, exception compiler-rt
    "BSD-2-Clause",                 # 6 crates
    "BSD-3-Clause",                 # 8 crates
    "ISC",                          # Équivalent simplifié du MIT
    "Zlib",                         # Très permissive, 4+ crates

    # Domaine public et assimilées
    "0BSD",                         # BSD sans obligation
    "CC0-1.0",                      # Domaine public
    "Unlicense",                    # Domaine public
    "BSL-1.0",                      # Boost Software License

    # Unicode et NCSA (exigées par des « AND »)
    "Unicode-3.0",                  # Unicode data files (icu, etc.)
    "NCSA",                         # Université de l'Illinois, exigée par (MIT OR Apache-2.0) AND NCSA

    # Données TLS (téléchargement de styles, consenti)
    "CDLA-Permissive-2.0",          # webpki-roots : magasin de racines Mozilla, usage libre avec attribution
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

# ── Bannissements ───────────────────────────────────────────────────────
# Les versions multiples sont courantes dans un arbre de dépendances aussi
# profond (iced + typst + leurs communs). On signale sans bloquer.
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Les doublons les plus fréquents — ils viennent de la divergence de versions
# entre iced et typst, ou entre dépendances OS et génériques. Skipper un
# crate revient à ignorer ses doublons dans la détection.
skip = [
    "font-types",      # typst et ses dépendances de polices
    "hashbrown",       # tableaux de hachage, versions multiples dans std et dépendances
    "foldhash",        # dépendance de hashbrown
    "bitflags",        # versions majeures divergentes, API stable
    "base64",          # typst vs iced (encodage binaire)
    "itertools",       # typst vs dépendances de polices
]

# ── Sources ─────────────────────────────────────────────────────────────
# Rien que crates.io. Pas de git, pas de registre tiers.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
