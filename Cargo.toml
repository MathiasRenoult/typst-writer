[package]
name = "typst-writer"
version = "0.6.1"
edition = "2024"
rust-version = "1.92"
description = "Un éditeur pour écrire en Typst, avec le rendu du document final"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MathiasRenoult/typst-writer"
keywords = ["typst", "editor", "writing", "iced"]
categories = ["gui", "text-editors"]

[dependencies]
iced = { version = "0.14.0", features = ["smol", "image"] }
iced_aw = { version = "0.14", default-features = false, features = ["menu"] }
iced-code-editor = { version = "0.5.2", features = ["two-face"] }
lucide-icons = { version = "1.57.0", features = ["iced"] }
mimalloc = "0.1.52"
regex = "1.13.1"
fontdb = "0.23"
rfd = "0.17.2"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "0.8", features = ["preserve_order"] }
typst = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
hayagriva = { version = "0.10.1", features = ["archive"] }
citationberg = "0.7.0"
ureq = "2"
# Export portable : une archive unique, sans les codecs que rien n'écrit.
zip = { version = "9", default-features = false, features = ["deflate"] }
typst-library = "=0.15.1"
typst-syntax = "0.15.1"
pdf-render = "=1.3.0"
# Le calendrier local de `datetime.today()` : Typst expose la date par
# `World::today`, mais ne fournit pas d'horloge. `time` est déjà la
# bibliothèque de son `Datetime` ; l'ajouter explicitement donne la même
# date à l'aperçu et à l'export.
time = { version = "0.3.55", features = ["local-offset"] }
# Les couvertures de la bibliothèque : décoder le JPG/PNG choisi, le
# recadrer au format A4, et relire les vignettes mises en cache. Sans codecs
# inutiles : seuls le PNG et le JPEG sont demandés à l'auteur.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Le profil de développement n'optimise rien — c'est le bon réglage pour
# déboguer **son propre** code, et le mauvais pour une application dont le
# travail se fait dans ses dépendances : compiler Typst et rasteriser des pages
# y coûte 334 ms et 91 ms par page, contre 16 ms et 11 ms en release.
#
# Optimiser les seules dépendances rend `cargo run` utilisable au quotidien sans
# rien retirer au débogage : les assertions et les symboles de notre code
# restent, et les points d'arrêt aussi.
[profile.dev.package."*"]
opt-level = 2

# Le retour à la ligne au mot n'est pas réglable : le crate découpe au
# caractère, au dernier qui tient, ce qui tranche les mots en deux au milieu
# d'une ligne de prose. `vendor/iced-code-editor` porte ce correctif ; le diff
# par rapport à l'amont est documenté dans `vendor/iced-code-editor/PATCHES.md`.
[patch.crates-io]
iced-code-editor = { path = "vendor/iced-code-editor" }
pdf-render = { path = "vendor/pdf-render-1.3.0" }

[profile.release]
# Le debuginfo ne sert qu'aux débogueurs : les rapports de plantage gardent
# leurs symboles, le binaire de publication perd le tiers de son poids.
strip = "debuginfo"
