[package]
name = "typst-writer"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["smol", "image"] }
iced-code-editor = { version = "0.5.2", features = ["two-face"] }
lucide-icons = { version = "1.57.0", features = ["iced"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"
tower-lsp = "0.20.0"
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-syntax = "0.15.1"
typst-utils = "0.15.1"

# Le retour à la ligne au mot n'est pas réglable : le crate découpe au
# caractère, au dernier qui tient, ce qui tranche les mots en deux au milieu
# d'une ligne de prose. `vendor/iced-code-editor` porte ce correctif ; le diff
# par rapport à l'amont est documenté dans `vendor/iced-code-editor/PATCHES.md`.
[patch.crates-io]
iced-code-editor = { path = "vendor/iced-code-editor" }
