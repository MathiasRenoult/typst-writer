[package]
edition = "2024"
name = "pdf-render"
version = "1.3.0"
authors = [
    "PDFluent Contributors <team@pdfluent.com>",
    "Laurenz Stampfl <laurenz.stampfl@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A PDF rasterizer in pure Rust."
homepage = "https://pdfluent.com"
documentation = "https://pdfluent.com/docs"
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/pdfluent/pdfluent-sdk"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = [
    "embed-fonts",
    "embed-cmaps",
]
embed-cmaps = ["pdf-interpret/embed-cmaps"]
embed-fonts = ["pdf-interpret/embed-fonts"]

[lib]
name = "pdf_render"
path = "src/lib.rs"

[[test]]
name = "glyph_outline_cache"
path = "tests/glyph_outline_cache.rs"

[[test]]
name = "nested_rayon_renders"
path = "tests/nested_rayon_renders.rs"

[dependencies.bytemuck]
version = "1"
features = ["bytemuck_derive"]

[dependencies.fast_image_resize]
version = "6.0"
features = ["std"]
default-features = false

[dependencies.image]
version = "0.25"
features = ["png"]

[dependencies.kurbo]
version = "0.13.0"

[dependencies.pdf-interpret]
version = "=0.6.2"

[dependencies.vello_cpu]
version = "0.0.6"
features = [
    "std",
    "png",
    "u8_pipeline",
    "f32_pipeline",
]
default-features = false

[dev-dependencies.log]
version = "0.4"

[dev-dependencies.lopdf]
version = "=0.39.8"
package = "pdfluent-lopdf"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rayon]
version = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.vello_cpu]
version = "0.0.6"
features = [
    "std",
    "png",
    "u8_pipeline",
    "f32_pipeline",
    "multithreading",
]
default-features = false
